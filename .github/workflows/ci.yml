name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    name: PHP coding standards and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: gd, pdo_mysql
          tools: composer:v2
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpcs
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  react:
    name: React production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: react-app/.nvmrc
          cache: npm
          cache-dependency-path: react-app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          CI: "true"

  e2e:
    name: Install from config and smoke-test the APIs (DDEV)
    runs-on: ubuntu-latest
    needs: [php]
    steps:
      - uses: actions/checkout@v4
      - uses: ddev/github-action-setup-ddev@v1
      - run: ddev setup
      - run: python3 scripts/smoke_test.py https://hdcr.ddev.site
